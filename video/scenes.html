<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:SG;src:url(fonts/SpaceGrotesk-Regular.ttf);font-weight:400}
@font-face{font-family:SG;src:url(fonts/SpaceGrotesk-Medium.ttf);font-weight:500}
@font-face{font-family:SG;src:url(fonts/SpaceGrotesk-Bold.ttf);font-weight:700}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Scene renderer for "Abandoned, But Not Forgotten". draw(t) paints the frame at time t (seconds).
const W = 1920, H = 1080;
const cv = document.getElementById('c'), out = cv.getContext('2d');
const bufA = new OffscreenCanvas(W, H), bufB = new OffscreenCanvas(W, H);
let TL = null, SCENES = [];
// palette = the website's tokens (void, hull, line, dust, white, rust/cobalt, signal, silent)
const C = {
  bg: '#020307', ink: '#eef3ff', dim: '#a7b3cf', faint: '#3a4566', muted: '#6c7a9c',
  green: '#6f9dff', red: '#7e8fb8', amber: '#9cbcff', cobalt: '#3d7bff', blue: '#6f9dff'
};
const GRADE = 'grayscale(1) sepia(.9) hue-rotate(180deg) saturate(2.1) brightness(.78) contrast(1.15)';
const TEX = {};
for (const n of ['moon', 'mars', 'earthblue']) { const im = new Image(); im.src = 'tex/' + n + '.jpg'; TEX[n] = im; }
// two-tone title like the site: periwinkle -> white gradient, uppercase, tight tracking
function gtxt(g, s, x, y, { size = 96, weight = 600, align = 'center', alpha = 1, soft = false, track = -2 } = {}) {
  g.save(); g.globalAlpha *= alpha * (soft ? .78 : 1); g.font = `${weight} ${size}px SG`; g.letterSpacing = track + 'px';
  g.textAlign = align; g.textBaseline = 'middle';
  const w = g.measureText(s).width, x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const gr = g.createLinearGradient(x0, y - size / 2, x0 + w, y + size / 2);
  gr.addColorStop(0, '#86a3e8'); gr.addColorStop(.45, '#b9cbf2'); gr.addColorStop(1, '#f5f7ff');
  g.fillStyle = gr; g.fillText(s, x, y); g.restore();
}
function texPlanet(g, name, x, y, r, rot = 0) {
  const im = TEX[name]; g.save();
  g.beginPath(); g.arc(x, y, r, 0, 7); g.clip();
  g.filter = GRADE;
  if (im.complete && im.naturalWidth) { const h = 2 * r, w = h * im.naturalWidth / im.naturalHeight, ox = ((rot * w) % w); g.drawImage(im, x - r - ox, y - r, w, h); g.drawImage(im, x - r - ox + w, y - r, w, h); }
  g.filter = 'none';
  const sh = g.createRadialGradient(x - r * .35, y - r * .35, r * .1, x - r * .2, y - r * .2, r * 1.3);
  sh.addColorStop(0, 'rgba(255,255,255,.10)'); sh.addColorStop(.55, 'rgba(2,3,7,.05)'); sh.addColorStop(.85, 'rgba(2,3,7,.75)'); sh.addColorStop(1, 'rgba(2,3,7,.95)');
  g.fillStyle = sh; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore();
  g.save(); g.shadowColor = 'rgba(61,123,255,.45)'; g.shadowBlur = 70; g.strokeStyle = 'rgba(160,190,255,.15)'; g.lineWidth = 1; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.restore();
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, x) => a + (b - a) * x;
const fin = (u, s, d = .6) => eout((u - s) / d);           // fade-in helper
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------- shared primitives ----------
const STARS = (() => { const r = rng(7), a = []; for (let i = 0; i < 900; i++) a.push([r() * W * 1.4 - W * .2, r() * H * 1.4 - H * .2, r() * 1.6 + .2, r(), r()]); return a; })();
function stars(g, t, { alpha = 1, drift = 6, zoom = 1, cx = W / 2, cy = H / 2 } = {}) {
  g.save();
  for (const [x, y, s, b, ph] of STARS) {
    const px = cx + (x - cx) * zoom - t * drift * s, py = cy + (y - cy) * zoom;
    const xx = ((px % (W * 1.4)) + W * 1.4) % (W * 1.4) - W * .2;
    const tw = .55 + .45 * Math.sin(t * (1 + ph * 2) + ph * 20);
    g.globalAlpha = alpha * (.25 + .75 * b) * tw;
    g.fillStyle = b > .93 ? '#ffe9c7' : b < .08 ? '#c7dcff' : '#fff';
    g.fillRect(xx, py, s * zoom, s * zoom);
  }
  g.restore();
}
function bg(g, col = C.bg) { g.fillStyle = col; g.fillRect(0, 0, W, H); }
function vignette(g, k = .75) {
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${k})`);
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function txt(g, s, x, y, { size = 48, weight = 500, color = C.ink, align = 'center', alpha = 1, track = 0, base = 'middle' } = {}) {
  g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  g.font = `${weight} ${size}px SG`;
  if (track) g.letterSpacing = track + 'px';
  g.fillText(s, x, y); g.restore();
}
function mono(g, s, x, y, o = {}) { txt(g, s, x, y, { size: 22, weight: 500, track: 4, color: C.dim, ...o }); }
function pill(g, x, y, w, h, r, fill, stroke) {
  g.beginPath(); g.roundRect(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); }
}
function blink(t, hz = 1) { return Math.sin(t * Math.PI * 2 * hz) > -.2 ? 1 : .15; }
function signalTag(g, x, y, label, value, col, t, a = 1) {
  g.save(); g.globalAlpha *= a;
  pill(g, x, y, 380, 64, 10, 'rgba(10,14,22,.85)', 'rgba(255,255,255,.12)');
  g.globalAlpha *= blink(t, .8);
  g.fillStyle = col; g.beginPath(); g.arc(x + 32, y + 32, 9, 0, 7); g.fill();
  g.shadowColor = col; g.shadowBlur = 18; g.fill(); g.shadowBlur = 0;
  g.restore();
  g.save(); g.globalAlpha *= a;
  mono(g, label, x + 56, y + 33, { align: 'left', size: 20, color: C.dim });
  txt(g, value, x + 360, y + 34, { align: 'right', size: 26, weight: 700, color: col, track: 3 });
  g.restore();
}
function planet(g, x, y, r, c1, c2, { light = -0.6, bands = 0, seed = 1, craters = 0 } = {}) {
  g.save();
  const gr = g.createRadialGradient(x + r * light * .6, y + r * light * .6, r * .1, x, y, r);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = gr; g.fill(); g.clip();
  const R = rng(seed);
  for (let i = 0; i < craters; i++) {
    const a = R() * 7, d = Math.sqrt(R()) * r, cr = r * (.03 + R() * .09);
    g.fillStyle = `rgba(0,0,0,${.08 + R() * .12})`;
    g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, cr, 0, 7); g.fill();
  }
  for (let i = 0; i < bands; i++) {
    g.fillStyle = `rgba(0,0,0,${.05 + R() * .08})`;
    g.fillRect(x - r, y - r + R() * 2 * r, 2 * r, r * (.03 + R() * .08));
  }
  const lx = x + r * light * .7, ly = y + r * light * .7;
  const sh = g.createRadialGradient(lx, ly, 0, lx, ly, r * 1.9);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(.5, 'rgba(0,0,0,.1)'); sh.addColorStop(.8, 'rgba(0,0,0,.7)'); sh.addColorStop(1, 'rgba(0,0,0,.95)');
  g.fillStyle = sh; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  g.restore();
}
// generic deep-space probe silhouette: dish, bus, boom, RTG arm
function probe(g, x, y, s, rot = 0, col = '#d8dee9') {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 2.2 / s * s;
  g.beginPath(); g.ellipse(0, 0, 36, 12, 0, 0, 7); g.globalAlpha *= .95; g.fill();
  g.fillStyle = '#9aa4b5'; g.beginPath(); g.ellipse(0, -2, 30, 8, 0, 0, 7); g.fill();
  g.fillStyle = col; g.fillRect(-12, 10, 24, 14);
  g.beginPath(); g.moveTo(0, -10); g.lineTo(0, -30); g.stroke();
  g.lineWidth = 1.6; g.beginPath(); g.moveTo(12, 18); g.lineTo(80, 40); g.stroke();
  g.beginPath(); g.moveTo(-12, 18); g.lineTo(-58, 34); g.stroke();
  g.fillRect(-66, 30, 14, 10); g.fillRect(76, 36, 10, 8);
  g.restore();
}
// generic six-wheeled solar rover silhouette
function rover(g, x, y, s, col = '#1a0b06', dusty = 0) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 3;
  g.fillRect(-70, -48, 140, 22);                // deck
  g.beginPath(); g.moveTo(-110, -50); g.lineTo(-70, -48); g.lineTo(-70, -42); g.lineTo(-118, -44); g.fill(); // wing
  g.beginPath(); g.moveTo(110, -50); g.lineTo(70, -48); g.lineTo(70, -42); g.lineTo(118, -44); g.fill();
  g.fillRect(-36, -26, 70, 16);                 // body
  g.fillRect(40, -110, 6, 62); g.fillRect(28, -122, 30, 14); // mast + head
  g.beginPath(); g.moveTo(-60, -10); g.lineTo(-30, -26); g.lineTo(0, -10); g.lineTo(30, -26); g.lineTo(60, -10); g.stroke();
  for (const wx of [-62, 0, 62]) { g.beginPath(); g.arc(wx, -2, 12, 0, 7); g.fill(); }
  if (dusty) { g.fillStyle = `rgba(120,150,220,${dusty * .5})`; g.fillRect(-118, -52, 236, 8); }
  g.restore();
}
function marsGround(g, t, { horizon = 720, dust = 0, sunA = 1 } = {}) {
  const sky = g.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#03060f'); sky.addColorStop(.6, '#0a1838'); sky.addColorStop(1, '#3a5290');
  g.fillStyle = sky; g.fillRect(0, 0, W, horizon);
  // sun
  g.save(); g.globalAlpha = sunA * (1 - dust * .92);
  const sx = 1380, sy = 260, sg = g.createRadialGradient(sx, sy, 0, sx, sy, 160);
  sg.addColorStop(0, 'rgba(235,240,255,1)'); sg.addColorStop(.15, 'rgba(190,210,240,.7)'); sg.addColorStop(1, 'rgba(190,210,240,0)');
  g.fillStyle = sg; g.fillRect(sx - 160, sy - 160, 320, 320); g.restore();
  // hills
  const R = rng(3);
  for (let L = 0; L < 3; L++) {
    g.beginPath(); g.moveTo(0, H);
    const base = horizon - 60 + L * 45, amp = 60 - L * 15, ph = R() * 10;
    for (let x = 0; x <= W; x += 20) g.lineTo(x, base - amp * (.5 + .5 * Math.sin(x / (260 - L * 50) + ph)) * (.6 + .4 * Math.sin(x / 90 + ph)));
    g.lineTo(W, H); g.closePath();
    g.fillStyle = ['#22346a', '#152450', '#0a1430'][L]; g.fill();
  }
  // rocks
  const R2 = rng(11);
  for (let i = 0; i < 70; i++) {
    const x = R2() * W, y = horizon + 40 + R2() * 340, r = 2 + R2() * 9 * (y - horizon) / 300;
    g.fillStyle = 'rgba(2,3,7,.55)'; g.beginPath(); g.ellipse(x, y, r * 1.6, r, 0, 0, 7); g.fill();
  }
  if (dust > 0) {
    g.save(); g.globalAlpha = dust;
    g.fillStyle = '#3d5490'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 6; i++) {
      const gx = ((t * (90 + i * 40) + i * 400) % (W + 1200)) - 600;
      const dg = g.createRadialGradient(gx, 400 + i * 80, 0, gx, 400 + i * 80, 520);
      dg.addColorStop(0, 'rgba(10,18,48,.5)'); dg.addColorStop(1, 'rgba(10,18,48,0)');
      g.fillStyle = dg; g.fillRect(0, 0, W, H);
    }
    g.restore();
  }
}
// grain for filmic texture
const GRAIN = (() => { const c = new OffscreenCanvas(512, 512), g = c.getContext('2d'), d = g.createImageData(512, 512), r = rng(99); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 9; } g.putImageData(d, 0, 0); return c; })();
function grain(g, t) { const ox = (Math.floor(t * 24) * 137) % 512, oy = (Math.floor(t * 24) * 271) % 512; g.save(); g.translate(-ox, -oy); for (let x = 0; x < W + 512; x += 512) for (let y = 0; y < H + 512; y += 512) g.drawImage(GRAIN, x, y); g.restore(); }
function browser(g, x, y, w, h, { tabs = ['Mission page'], active = 0, url = 'nasa.gov', a = 1 } = {}) {
  g.save(); g.globalAlpha *= a;
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 40; g.shadowOffsetY = 18;
  pill(g, x, y, w, h, 14, '#151a24'); g.shadowBlur = 0; g.shadowOffsetY = 0;
  pill(g, x, y, w, h, 14, null, 'rgba(255,255,255,.10)');
  for (let i = 0; i < 3; i++) { g.fillStyle = ['#ff5f57', '#febc2e', '#28c840'][i]; g.beginPath(); g.arc(x + 26 + i * 22, y + 24, 6.5, 0, 7); g.fill(); }
  const tw = Math.min(220, (w - 110) / tabs.length);
  tabs.forEach((s, i) => {
    const tx = x + 96 + i * tw;
    pill(g, tx, y + 8, tw - 6, 32, 8, i === active ? '#232a38' : 'rgba(255,255,255,.03)');
    g.save(); g.beginPath(); g.rect(tx + 8, y + 8, tw - 22, 32); g.clip();
    txt(g, s, tx + 14, y + 25, { size: 15, align: 'left', color: i === active ? C.ink : C.dim }); g.restore();
  });
  pill(g, x + 16, y + 50, w - 32, 34, 17, '#0d1118');
  txt(g, url, x + 40, y + 68, { size: 16, align: 'left', color: C.dim });
  g.restore();
}
function docLines(g, x, y, w, n, seed, a = 1) {
  const R = rng(seed); g.save(); g.globalAlpha *= a;
  for (let i = 0; i < n; i++) { g.fillStyle = i % 7 === 0 ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.12)'; g.fillRect(x, y + i * 26, w * (i % 7 === 0 ? .45 : .6 + R() * .4), i % 7 === 0 ? 12 : 8); }
  g.restore();
}

// ---------- scenes: each fn(g, u, d, t, line) with u = local time, d = scene length ----------
const S = {};
S.signal = (g, u, d, t, L) => {
  bg(g, '#000');
  const second = L.idx === 1 || u > (TL.lines[1].start - L.sceneStart - .3);
  if (!second) {
    // black, "SIGNAL: NONE" indicator, then title, then deep space with Voyager-like probe
    const sa = fin(u, 2.4, 2.5);
    stars(g, t, { alpha: sa, drift: 3 });
    const z = 1 + u * .02;
    g.save(); g.globalAlpha = sa;
    probe(g, W * .62, H * .42, .9 * z, -.25 + u * .01);
    // outgoing signal rings toward camera
    for (let i = 0; i < 4; i++) {
      const p = ((u * .35 + i / 4) % 1);
      g.strokeStyle = `rgba(111,157,255,${(1 - p) * .55})`; g.lineWidth = 2;
      g.beginPath(); g.arc(W * .62, H * .42, 20 + p * 900, 0, 7); g.stroke();
    }
    g.restore();
    signalTag(g, 80, 80, 'SIGNAL', u < 2.4 ? 'NONE' : 'RECEIVING', u < 2.4 ? C.red : C.green, t, fin(u, .2, .5));
    // title card at the head
    const ta = fin(u, .6, .8) * (1 - fin(u, 2.2, .6));
    gtxt(g, 'ABANDONED, BUT NOT FORGOTTEN.', W / 2, H / 2, { size: 72, alpha: ta });
    if (u > 2.6) {
      const km = Math.round(24.9e9 + (u - 2.6) * 61000);
      mono(g, 'LAUNCHED 1977  ·  DISTANCE FROM EARTH', 120, 760, { align: 'left', alpha: fin(u, 3) });
      txt(g, km.toLocaleString('en-US') + ' km', 120, 820, { size: 72, weight: 700, align: 'left', alpha: fin(u, 3.2), track: 2 });
    }
  } else {
    const u2 = u - (TL.lines[1].start - L.sceneStart) + .3;
    marsGround(g, t, { horizon: 700 });
    rover(g, 980 + u2 * 4, 830, 1.1, '#02040b', .6);
    vignette(g, .7);
    signalTag(g, 80, 80, 'SIGNAL', 'NONE', C.red, t, 1);
    mono(g, 'MARS  ·  LAST CONTACT', 120, 760, { align: 'left', alpha: fin(u2, .3) });
    const yrs = Math.min(8, Math.floor(u2 * 2.2));
    txt(g, yrs + (yrs === 1 ? ' year' : ' years') + ' of silence', 120, 820, { size: 72, weight: 700, align: 'left', alpha: fin(u2, .5) });
  }
  vignette(g, .6);
};
S.split = (g, u) => {
  bg(g, '#000');
  const k = ease(u / 1.2), mid = W / 2;
  g.save(); g.beginPath(); g.rect(0, 0, mid, H); g.clip();
  stars(g, u, { drift: 4 }); probe(g, mid * .5, H * .44, 1.1, -.2);
  for (let i = 0; i < 3; i++) { const p = ((u * .4 + i / 3) % 1); g.strokeStyle = `rgba(111,157,255,${(1 - p) * .5})`; g.lineWidth = 2; g.beginPath(); g.arc(mid * .5, H * .44, 30 + p * 420, 0, 7); g.stroke(); }
  g.restore();
  g.save(); g.beginPath(); g.rect(mid, 0, mid, H); g.clip(); g.translate(mid * .5, 0);
  marsGround(g, u, { horizon: 640 }); rover(g, mid * .5 + 480, 760, .9, '#02040b', .7);
  g.restore();
  g.fillStyle = '#000'; g.fillRect(mid - 2, 0, 4, H);
  g.save(); g.globalAlpha = k; g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, W, H); g.restore();
  signalTag(g, mid / 2 - 190, 800, 'DEEP SPACE', 'TALKING', C.green, u, fin(u, .4));
  signalTag(g, mid + mid / 2 - 190, 800, 'MARS', 'SILENT', C.red, u, fin(u, .8));
  const words = ['Same agency.', 'Same promise.', 'Two very different endings.'];
  words.forEach((w, i) => gtxt(g, w.toUpperCase(), W / 2, 200, { size: 72, alpha: fin(u, i * 1.25, .4) * (i < 2 ? 1 - fin(u, (i + 1) * 1.25, .3) : 1) }));
  vignette(g, .5);
};
S.team = (g, u) => {
  bg(g); stars(g, u + 20, { alpha: .5, drift: 2 });
  mono(g, 'TEAM  ·  BANGLADESH', W / 2, 250, { size: 26, alpha: fin(u, 0) });
  gtxt(g, 'FOUR PEOPLE. ONE QUESTION.', W / 2, 330, { size: 76, alpha: fin(u, .3) });
  const roles = [['Developer', '</>'], ['Researcher', '◎'], ['Designer', '◆'], ['Storyteller', '“ ”']];
  roles.forEach(([r, ic], i) => {
    const x = W / 2 + (i - 1.5) * 330, y = 560, a = fin(u, 3.2 + i * .9, .5);
    g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 30);
    pill(g, x - 140, y - 120, 280, 240, 20, 'rgba(255,255,255,.04)', 'rgba(255,255,255,.12)');
    txt(g, ic, x, y - 30, { size: 52, weight: 700, color: C.blue });
    txt(g, r, x, y + 60, { size: 34, weight: 500 });
    g.restore();
  });
  vignette(g);
};
S.question = (g, u, d) => {
  bg(g, '#000'); stars(g, u + 50, { alpha: .35, drift: 1.5 });
  const q1 = 'When a mission goes quiet,', q2 = 'where does its story go?';
  const n = Math.floor(clamp((u - 1.6) / 2.6) * (q1.length + q2.length));
  mono(g, 'THE QUESTION WE KEPT ASKING', W / 2, 340, { alpha: fin(u, .2) });
  gtxt(g, q1.slice(0, n), W / 2, 470, { size: 84, track: -1 });
  gtxt(g, q2.slice(0, Math.max(0, n - q1.length)), W / 2, 570, { size: 84, weight: 400, soft: true, track: -1 });
  if (Math.floor(u * 2) % 2 === 0) { const s = n < q1.length ? q1.slice(0, n) : q2.slice(0, n - q1.length); g.font = '600 84px SG'; g.letterSpacing = '-1px'; const w = g.measureText(s).width; g.fillStyle = C.ink; g.fillRect(W / 2 + w / 2 + 8, n < q1.length ? 430 : 530, 5, 80); }
  vignette(g);
};
S.title = (g, u, d) => {
  bg(g, '#000'); stars(g, u + 80, { alpha: 1, drift: 2, zoom: 1 + u * .015 });
  texPlanet(g, 'earthblue', W * .5, H * 1.55, 900, u * .004);
  const a = fin(u, 1.2, 1.2);
  g.save(); g.shadowColor = 'rgba(61,123,255,.45)'; g.shadowBlur = 50 * a;
  gtxt(g, 'ABANDONED,', W / 2, 380, { size: 132, alpha: a });
  gtxt(g, 'BUT NOT FORGOTTEN.', W / 2, 510, { size: 132, weight: 400, soft: true, alpha: fin(u, 1.7, 1.2) });
  g.restore();
  mono(g, 'AN ARCHIVE OF NASA MISSIONS THAT WENT QUIET', W / 2, 620, { alpha: fin(u, 2.4) });
  vignette(g, .6);
};
S.hardware = (g, u, d) => {

const SITE_RECT = { x: 120, y: 150, w: 1680, h: 740 };
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function setup(tl) {
  TL = tl; SCENES = [];
  tl.lines.forEach((l, i) => {
    l.idx = i;
    const prev = SCENES[SCENES.length - 1];
    if (prev && prev.key === l.scene) return;
    const start = i === 0 ? 0 : l.start - .55;
    if (prev) prev.end = start;
    const [kind, label] = l.scene.startsWith('site:') ? ['site', l.scene.slice(5)] : [l.scene, ''];

  SCENES[SCENES.length - 1].end = tl.total;

}
